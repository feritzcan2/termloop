# Light-mode colors are kept separate from ghostty-embedded.conf so the dark
# terminal remains byte-for-byte equivalent to TermLoop's original Ghostty
# defaults. This file is layered over the embedded config only in light mode.
background = #f9f9f9
foreground = #2a2c33
cursor-color = #555963
cursor-text = #ffffff
selection-background = #d9e2ec
selection-foreground = #20222a
minimum-contrast = 3
palette = 0=#000000
palette = 1=#de3e35
palette = 2=#3f953a
palette = 3=#9a6c16
palette = 4=#2f5af3
palette = 5=#a35300
palette = 6=#197a73
palette = 7=#bbbbbb
palette = 8=#5d626b
palette = 9=#c9342d
palette = 10=#327b2e
palette = 11=#7c5812
palette = 12=#244bd5
palette = 13=#8a4500
palette = 14=#14645f
palette = 15=#ffffff
