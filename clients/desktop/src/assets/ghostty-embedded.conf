# TermLoop owns application, tab, split, and process lifecycle. The embedded
# Ghostty surface owns only terminal-local behavior such as copy, paste, search,
# selection, scrolling, and terminal input encoding.
# Embedded NSViews redraw through the host. Avoid allocating a per-surface
# CVDisplayLink, which can fail under host display-resource pressure.
window-vsync = false
theme = light:Atom One Light,dark:Ghostty Default Style Dark
# ANSI slots 5 and 13 are traditionally magenta. TermLoop deliberately maps
# them to orange so embedded terminals follow the app's blue/teal palette
# without reintroducing purple through either built-in theme.
palette = 5=#a35300
palette = 13=#de935f
keybind = ctrl+tab=unbind
keybind = ctrl+shift+tab=unbind
keybind = super+enter=unbind
keybind = super+shift+enter=unbind
keybind = super+q=unbind
keybind = super+n=unbind
keybind = super+w=unbind
keybind = super+alt+w=unbind
keybind = super+shift+w=unbind
keybind = super+shift+alt+w=unbind
keybind = super+t=unbind
keybind = super+shift+left_bracket=unbind
keybind = super+shift+right_bracket=unbind
keybind = super+d=unbind
keybind = super+shift+d=unbind
keybind = super+left_bracket=unbind
keybind = super+right_bracket=unbind
keybind = super+alt+up=unbind
keybind = super+alt+down=unbind
keybind = super+alt+left=unbind
keybind = super+alt+right=unbind
keybind = super+ctrl+up=unbind
keybind = super+ctrl+down=unbind
keybind = super+ctrl+left=unbind
keybind = super+ctrl+right=unbind
keybind = super+ctrl+==unbind
