[package]
name = "termloop-pm-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "termloop-pm-daemon"
path = "src/main.rs"

[dependencies]
axum.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
termloop-agent-runtime = { path = "../../modules/agent-runtime" }
termloop-agents = { path = "../../modules/agents" }
termloop-gitio = { path = "../../modules/gitio" }
termloop-launch = { path = "../../modules/launch" }
termloop-platform = { path = "../../modules/platform" }
termloop-pm = { path = "../../modules/pm" }
termloop-pm-contract = { path = "../../contract/generated/pm-rust" }
termloop-providers = { path = "../../modules/providers" }
termloop-terminal = { path = "../../modules/terminal" }
termloop-terminal-wire = { path = "../../modules/terminal-wire" }

[dev-dependencies]
termloop-gitio = { path = "../../modules/gitio", features = ["test-support"] }
termloop-platform = { path = "../../modules/platform", features = ["test-support"] }
