<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Launchpad · Release dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:#edf2f8;font:16px system-ui}main{max-width:1080px;margin:70px auto;padding:30px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #344155;padding-bottom:24px}small{color:#a8b7cc;letter-spacing:.12em}h1{font-size:46px;margin:16px 0}h2{font-size:24px}.pill{background:#2b3b32;color:#c0f5ce;padding:10px 18px;border-radius:24px}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:32px 0}.card{background:#1a2230;border:1px solid #344155;padding:26px;border-radius:14px}.stat{font-size:40px;color:#f0b860}p{color:#a8b7cc;line-height:1.6}progress{width:100%;accent-color:#f0b860}footer{color:#a8b7cc;margin-top:40px}@media(max-width:650px){.grid,.stats{grid-template-columns:1fr}header{display:block}}
</style><main><header><div><small>LAUNCHPAD / TEAM WORKSPACE</small><h1>Ship the next good thing.</h1><p>Your release, from the first task to the final review.</p></div><span class="pill">September release · On track</span></header><section class="stats"><div class="card"><small>RELEASES IN FLIGHT</small><div class="stat">3</div></div><div class="card"><small>CHECKLIST ITEMS DONE</small><div class="stat">14 / 20</div></div><div class="card"><small>READY TO SHIP</small><div class="stat">1</div></div></section><h2>Release board</h2><section class="grid" id="releases"></section><footer>Demo workspace · Fictional team and sample data · Local preview</footer></main><script type="module">import {releases,progress} from './src/releases.mjs';for(const r of releases){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.textContent=r.name;const detail=document.createElement('p');detail.textContent=r.owner+' · '+r.status;const bar=document.createElement('progress');bar.max=100;bar.value=progress(r.done,r.total);bar.setAttribute('aria-label',r.name+' progress');const count=document.createElement('p');count.textContent=r.done+' of '+r.total+' items complete';card.append(title,detail,bar,count);document.querySelector('#releases').append(card)}</script></html>
