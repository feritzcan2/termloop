name: TermLoopWatch
options:
  bundleIdPrefix: com.termloop.watch
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TermLoopWatch:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    info:
      path: iOS/Info.plist
      properties:
        NSLocalNetworkUsageDescription: "TermLoop Mac'e bağlanmak için aynı yerel ağa erişim gerekiyor."
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: YES
    entitlements:
      path: iOS/TermLoopWatch.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termloop.watch
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: TermLoopWatchWatch

  TermLoopWatchWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    info:
      path: Watch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.termloop.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termloop.watch.watchkitapp
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
