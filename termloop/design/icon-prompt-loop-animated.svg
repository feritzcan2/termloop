<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFD2A1"/>
      <stop offset="55%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#E94B6A"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFB088" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFB088" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="225" ry="225" fill="url(#bg)"/>

  <!-- Halo: ring kapandıktan sonra yumuşak gelir -->
  <circle cx="512" cy="512" r="380" fill="url(#halo)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.5s" fill="freeze"/>
  </circle>

  <!-- 1. Chevron 0 → 400ms çizilir -->
  <polyline points="232,332 432,512 232,692"
    fill="none" stroke="url(#mark)" stroke-width="78"
    stroke-linecap="round" stroke-linejoin="round"
    stroke-dasharray="540" stroke-dashoffset="540"
    filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
             from="540" to="0"
             begin="0s" dur="0.4s"
             fill="freeze"/>
  </polyline>

  <!-- 2. Cursor 300ms'de fade in, 500ms'den itibaren blink -->
  <rect x="616" y="448" width="48" height="128" rx="8" fill="url(#mark)" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.25;1" begin="0.5s" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- 3. Loop ring 400 → 900ms üst-merkezden saat yönünde traces -->
  <circle cx="640" cy="512" r="180"
    fill="none" stroke="url(#mark)" stroke-width="78"
    stroke-linecap="round"
    stroke-dasharray="1131" stroke-dashoffset="1131"
    filter="url(#glow)"
    transform="rotate(-90 640 512)">
    <animate attributeName="stroke-dashoffset"
             from="1131" to="0"
             begin="0.4s" dur="0.5s"
             fill="freeze"/>
  </circle>
</svg>
