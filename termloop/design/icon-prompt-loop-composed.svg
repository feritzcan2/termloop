<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFD2A1"/>
      <stop offset="55%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#E94B6A"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFB088" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFB088" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="225" ry="225" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="380" fill="url(#halo)"/>

  <g stroke="url(#mark)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <polyline points="232,332 432,512 232,692"/>
    <circle cx="640" cy="512" r="180"/>
  </g>

  <rect x="616" y="448" width="48" height="128" rx="8" fill="url(#mark)" filter="url(#glow)"/>
</svg>
