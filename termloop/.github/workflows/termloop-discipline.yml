name: TermLoop discipline

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/feritzcan2/termloop.git || true
          git fetch upstream main --depth=1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run TermLoop discipline check
        run: python3 scripts/termloop-check.py --vs upstream/main

      - name: Verify hooks inventory is up to date
        run: |
          python3 scripts/generate-hooks-inventory.py
          if ! git diff --quiet -- docs/termloop/hooks-inventory.md; then
            echo "::error::hooks-inventory.md is stale. Run scripts/generate-hooks-inventory.py and commit." >&2
            git --no-pager diff -- docs/termloop/hooks-inventory.md
            exit 1
          fi
