[workspace]
resolver = "2"
members = [
  "contract/generated/rust",
  "modules/domain",
  "modules/platform",
  "modules/gitio",
  "modules/providers",
  "modules/agents",
  "modules/invocation",
  "modules/store",
  "modules/terminal",
  "modules/observability",
  "modules/llm",
  "modules/core",
  "apps/server",
  "apps/companion",
  "spikes/r0-terminal/server",
]

[workspace.package]
version = "2.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["ws"] }
base64 = "0.22.1"
caseless = "0.2.2"
ed25519-dalek = "2.2.0"
futures-util = "0.3.31"
keyring = "4.1.6"
notify = "8.2.0"
portable-pty = "0.9.0"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
similar = "=2.7.0"
regex = "1.12.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = "0.28.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
unicode-normalization = "0.1.24"
zeroize = "1.8.2"
