name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  confirm-candidate:
    runs-on: ubuntu-24.04
    env:
      TERMLOOP_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Confirm immutable candidate remains in main history
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          test "$candidate_sha" = "$GITHUB_SHA"
          remote_tag_sha="$(git ls-remote origin "refs/tags/$TERMLOOP_RELEASE_TAG" | awk 'NR == 1 { print $1 }')"
          test "$remote_tag_sha" = "$candidate_sha"
          git fetch origin --prune --no-tags \
            '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$candidate_sha" refs/remotes/origin/main
      - name: Require successful native CI for the exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          ci_run_id="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f event=workflow_dispatch \
              -f status=success \
              -f head_sha="$candidate_sha" \
              -f per_page=1 \
              --jq '.workflow_runs[0].id // empty'
          )"
          test -n "$ci_run_id" || {
            echo "No successful manual CI run exists for $candidate_sha." >&2
            exit 1
          }
          echo "Verified CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$ci_run_id"

  build:
    needs: confirm-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runs-on: '["self-hosted", "macOS", "ARM64", "termloop-macos"]'
            os: macos
            arch: universal
            archive: tar.gz
          - runner: ubuntu-24.04
            runs-on: '["ubuntu-24.04"]'
            os: linux
            arch: x64
            archive: tar.gz
          - runner: windows-2025
            runs-on: '["windows-2025"]'
            os: windows
            arch: x64
            archive: zip
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    timeout-minutes: ${{ matrix.os == 'macos' && 120 || 45 }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      TERMLOOP_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify pinned Zig for Ghostty
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(zig version)" = "0.15.2"
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal
      - run: pnpm install --frozen-lockfile
      - name: Validate release version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$TERMLOOP_RELEASE_TAG" = "v$version"
          node tools/release/check-version-sync.mjs
          echo "TERMLOOP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build native binaries and CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --release --target aarch64-apple-darwin -p termloop-server -p termloop-companion
            cargo build --release --target x86_64-apple-darwin -p termloop-server -p termloop-companion
            mkdir -p target/release
            for binary in termloop-server termloop-companion; do
              lipo -create \
                "target/aarch64-apple-darwin/release/$binary" \
                "target/x86_64-apple-darwin/release/$binary" \
                -output "target/release/$binary"
            done
            node tools/skills-manager/fetch-cli.mjs --arch universal --output target/release/skills-manager-cli
          else
            cargo build --release -p termloop-server -p termloop-companion
            node tools/skills-manager/fetch-cli.mjs --output target/release/skills-manager-cli
          fi
          pnpm --filter @termloop/cli build:bundle -- --outfile="$RUNNER_TEMP/server-stage/termloopctl.mjs"
      - name: Validate macOS signing secrets
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_API_KEY_BASE64: ${{ secrets.MACOS_API_KEY_BASE64 }}
          MACOS_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          MACOS_API_ISSUER: ${{ secrets.MACOS_API_ISSUER }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY; do
            test -n "${!name:-}" || { echo "Missing required macOS release secret: $name" >&2; exit 1; }
          done
          api_key_ready=1
          for name in MACOS_API_KEY_BASE64 MACOS_API_KEY_ID MACOS_API_ISSUER; do
            test -n "${!name:-}" || api_key_ready=0
          done
          apple_id_ready=1
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || apple_id_ready=0
          done
          if [ "$api_key_ready" -ne 1 ] && [ "$apple_id_ready" -ne 1 ]; then
            echo "Missing complete macOS notarization credentials" >&2
            exit 1
          fi
      - name: Validate Windows signing secrets
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in WINDOWS_CERTIFICATE_BASE64 WINDOWS_CERTIFICATE_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing required Windows release secret: $name" >&2; exit 1; }
          done
      - name: Package desktop installers
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_API_KEY_BASE64: ${{ secrets.MACOS_API_KEY_BASE64 }}
          MACOS_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          MACOS_API_ISSUER: ${{ secrets.MACOS_API_ISSUER }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            keychain_path="$RUNNER_TEMP/termloop-release-signing.keychain-db"
            certificate_path="$RUNNER_TEMP/termloop-release-signing.p12"
            api_key_path=""
            keychain_password="$(uuidgen)"
            original_default_keychain="$(
              security default-keychain -d user |
                sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//'
            )"
            original_keychains=()
            while IFS= read -r existing_keychain; do
              existing_keychain="${existing_keychain#*\"}"
              existing_keychain="${existing_keychain%\"*}"
              test -n "$existing_keychain" && original_keychains+=("$existing_keychain")
            done < <(security list-keychains -d user)
            cleanup() {
              if [ -n "$original_default_keychain" ]; then
                security default-keychain -d user -s "$original_default_keychain" >/dev/null 2>&1 || true
              fi
              if [ "${#original_keychains[@]}" -gt 0 ]; then
                security list-keychains -d user -s "${original_keychains[@]}" >/dev/null 2>&1 || true
              fi
              security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
              rm -f "$certificate_path"
              test -z "$api_key_path" || rm -f "$api_key_path"
            }
            trap cleanup EXIT
            printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
            chmod 600 "$certificate_path"
            if [ -n "$MACOS_API_KEY_BASE64" ] && [ -n "$MACOS_API_KEY_ID" ] && [ -n "$MACOS_API_ISSUER" ]; then
              api_key_path="$RUNNER_TEMP/AuthKey_${MACOS_API_KEY_ID}.p8"
              printf '%s' "$MACOS_API_KEY_BASE64" | base64 -D > "$api_key_path"
              chmod 600 "$api_key_path"
              export APPLE_API_KEY="$api_key_path"
              export APPLE_API_KEY_ID="$MACOS_API_KEY_ID"
              export APPLE_API_ISSUER="$MACOS_API_ISSUER"
            fi
            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
            security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"
            security default-keychain -d user -s "$keychain_path"
            security import "$certificate_path" \
              -P "$MACOS_CERTIFICATE_PASSWORD" \
              -t cert -f pkcs12 -k "$keychain_path" \
              -T /usr/bin/codesign \
              -T /usr/bin/security
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$keychain_password" "$keychain_path"
            security find-identity -v -p codesigning "$keychain_path" |
              grep -Fq -- "$MACOS_SIGNING_IDENTITY"
            electron_builder_identity="${MACOS_SIGNING_IDENTITY#Developer ID Application: }"
            export CSC_NAME="$electron_builder_identity"
            export CSC_KEYCHAIN="$keychain_path"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            codesign --force --options runtime --timestamp \
              --keychain "$keychain_path" \
              --sign "$MACOS_SIGNING_IDENTITY" target/release/termloop-server
            codesign --force --options runtime --timestamp \
              --keychain "$keychain_path" \
              --sign "$MACOS_SIGNING_IDENTITY" target/release/termloop-companion
            codesign --force --options runtime --timestamp \
              --keychain "$keychain_path" \
              --sign "$MACOS_SIGNING_IDENTITY" target/release/skills-manager-cli
            pnpm --filter @termloop/desktop native:ghostty:universal
            pnpm --filter @termloop/desktop build
            pnpm --filter @termloop/desktop exec electron-builder --config electron-builder.yml --universal
            codesign --verify --deep --strict --verbose=4 \
              "clients/desktop/out/mac-universal/TermLoop Next.app"
            codesign -dvv "clients/desktop/out/mac-universal/TermLoop Next.app" 2>&1 |
              grep -q "Authority=Developer ID Application"
            xcrun stapler validate "clients/desktop/out/mac-universal/TermLoop Next.app"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            certificate_path="$RUNNER_TEMP/termloop-release-signing.p12"
            cleanup_windows_certificate() {
              rm -f "$certificate_path"
            }
            trap cleanup_windows_certificate EXIT
            printf '%s' "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
            export CSC_LINK="$certificate_path"
            export CSC_KEY_PASSWORD="$WINDOWS_CERTIFICATE_PASSWORD"
            pnpm --filter @termloop/desktop package
            powershell -NoProfile -Command '
              $files = @(
                Get-ChildItem "clients/desktop/out" -File -Filter "termloop-desktop-windows-*.exe"
                Get-ChildItem "clients/desktop/out" -Recurse -File -Filter "TermLoop Next.exe"
              )
              if ($files.Count -lt 2) { throw "Expected signed Windows application and installer" }
              foreach ($file in $files) {
                $signature = Get-AuthenticodeSignature $file.FullName
                if ($signature.Status -ne "Valid") {
                  throw "Invalid Authenticode signature: $($file.Name) ($($signature.Status))"
                }
              }
            '
          else
            pnpm --filter @termloop/desktop package
          fi
      - name: Assemble release assets
        shell: bash
        run: |
          asset_dir="$RUNNER_TEMP/release-assets"
          server_dir="$RUNNER_TEMP/server-package"
          mkdir -p "$asset_dir" "$server_dir"
          cp tools/skills-manager/LICENSE "$server_dir/skills-manager-LICENSE"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/termloop-server.exe "$server_dir/termloop-server.exe"
            cp target/release/termloop-companion.exe "$server_dir/termloop-companion.exe"
            cp target/release/skills-manager-cli.exe "$server_dir/skills-manager-cli.exe"
            cp "$RUNNER_TEMP/server-stage/termloopctl.mjs" "$server_dir/termloopctl.mjs"
            printf '@echo off\r\nnode "%%~dp0termloopctl.mjs" %%*\r\n' > "$server_dir/termloopctl.cmd"
            powershell -NoProfile -Command "Compress-Archive -Path '$server_dir/*' -DestinationPath '$asset_dir/termloop-server-${{ matrix.os }}-${{ matrix.arch }}-$TERMLOOP_VERSION.zip'"
          else
            cp target/release/termloop-server "$server_dir/termloop-server"
            cp target/release/termloop-companion "$server_dir/termloop-companion"
            cp target/release/skills-manager-cli "$server_dir/skills-manager-cli"
            cp "$RUNNER_TEMP/server-stage/termloopctl.mjs" "$server_dir/termloopctl"
            chmod +x "$server_dir/termloop-server" "$server_dir/termloop-companion" "$server_dir/skills-manager-cli" "$server_dir/termloopctl"
            tar -C "$server_dir" -czf "$asset_dir/termloop-server-${{ matrix.os }}-${{ matrix.arch }}-$TERMLOOP_VERSION.tar.gz" .
          fi
          find clients/desktop/out -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) -print0 |
            while IFS= read -r -d '' file; do
              cp "$file" "$asset_dir/"
            done
          test "$(find "$asset_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" -ge 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      TERMLOOP_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Revalidate immutable candidate before publish
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          test "$candidate_sha" = "$GITHUB_SHA"
          remote_tag_sha="$(git ls-remote origin "refs/tags/$TERMLOOP_RELEASE_TAG" | awk 'NR == 1 { print $1 }')"
          test "$remote_tag_sha" = "$candidate_sha"
          git fetch origin --prune --no-tags \
            '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$candidate_sha" refs/remotes/origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify and checksum assets
        shell: bash
        run: |
          version="${TERMLOOP_RELEASE_TAG#v}"
          expected=(
            "termloop-server-macos-universal-$version.tar.gz"
            "termloop-desktop-macos-universal-$version.dmg"
            "termloop-desktop-macos-universal-$version.zip"
            "termloop-server-linux-x64-$version.tar.gz"
            "termloop-desktop-linux-x64-$version.AppImage"
            "termloop-desktop-linux-x64-$version.deb"
            "termloop-server-windows-x64-$version.zip"
            "termloop-desktop-windows-x64-$version.exe"
            "latest.yml"
            "latest-mac.yml"
            "latest-linux.yml"
          )
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset" || { echo "missing release asset: $asset" >&2; exit 1; }
          done
          declare -A allowed=()
          for asset in "${expected[@]}"; do allowed["$asset"]=1; done
          while IFS= read -r file; do
            asset="${file##*/}"
            if [ -z "${allowed[$asset]+present}" ] && [[ "$asset" != termloop-desktop-*.blockmap ]]; then
              echo "unexpected release asset: $asset" >&2
              exit 1
            fi
          done < <(find release-assets -maxdepth 1 -type f)
          (cd release-assets && sha256sum * > SHA256SUMS)
      - name: Publish desktop update feed atomically
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID R2_BUCKET_NAME UPDATE_BASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!name:-}" || { echo "Missing required update publication setting: $name" >&2; exit 1; }
          done
          test "$R2_BUCKET_NAME" = "termloop-updates"
          test "$UPDATE_BASE_URL" = "https://updates.termloop.ai/stable"
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          version="${TERMLOOP_RELEASE_TAG#v}"
          payloads=(
            "termloop-desktop-macos-universal-$version.dmg"
            "termloop-desktop-macos-universal-$version.zip"
            "termloop-desktop-linux-x64-$version.AppImage"
            "termloop-desktop-linux-x64-$version.deb"
            "termloop-desktop-windows-x64-$version.exe"
          )
          while IFS= read -r blockmap; do
            payloads+=("${blockmap##*/}")
          done < <(find release-assets -maxdepth 1 -type f -name 'termloop-desktop-*.blockmap' | sort)
          for asset in "${payloads[@]}"; do
            aws s3 cp "release-assets/$asset" "s3://$R2_BUCKET_NAME/stable/$asset" \
              --endpoint-url "$endpoint" \
              --only-show-errors \
              --cache-control "public,max-age=31536000,immutable"
          done
          for manifest in latest.yml latest-mac.yml latest-linux.yml; do
            aws s3 cp "release-assets/$manifest" "s3://$R2_BUCKET_NAME/stable/$manifest" \
              --endpoint-url "$endpoint" \
              --only-show-errors \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "application/yaml"
          done
      - name: Publish GitHub Release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TERMLOOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TERMLOOP_RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TERMLOOP_RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TERMLOOP_RELEASE_TAG" \
              --generate-notes
          fi
