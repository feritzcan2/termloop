name: TermLoop nightly build

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force:
        description: Force a nightly build even if master has no new commits
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly-build-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CREATE_DMG_VERSION: 8.0.0

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      short_sha: ${{ steps.decide.outputs.short_sha }}
      should_publish: ${{ steps.decide.outputs.should_publish }}
    steps:
      - name: Decide whether a nightly build is needed
        id: decide
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && 'true' || 'false' }}
        with:
          script: |
            const forceBuild = process.env.FORCE_BUILD === 'true';
            const { owner, repo } = context.repo;
            const requestedRef = context.ref.startsWith('refs/heads/')
              ? context.ref.replace('refs/heads/', '')
              : 'master';
            const isMasterRef = requestedRef === 'master';

            let headSha = context.sha;
            if (isMasterRef) {
              const branch = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: 'master',
              });
              headSha = branch.data.commit.sha;
            }

            let nightlySha = null;
            if (isMasterRef) {
              try {
                const ref = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: 'tags/nightly',
                });
                if (ref.data.object.type === 'commit') {
                  nightlySha = ref.data.object.sha;
                } else if (ref.data.object.type === 'tag') {
                  const tagObject = await github.rest.git.getTag({
                    owner,
                    repo,
                    tag_sha: ref.data.object.sha,
                  });
                  nightlySha = tagObject.data.object.sha;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const shouldBuild = !isMasterRef || forceBuild || nightlySha !== headSha;
            core.setOutput('should_build', shouldBuild ? 'true' : 'false');
            core.setOutput('head_sha', headSha);
            core.setOutput('short_sha', headSha.slice(0, 7));
            core.setOutput('should_publish', isMasterRef ? 'true' : 'false');

  build-sign-notarize-nightly:
    needs: decide
    if: needs.decide.outputs.should_build == 'true'
    runs-on: warp-macos-26-arm64-6x
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: termloop
    steps:
      - name: Checkout build ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.decide.outputs.head_sha }}

      - name: Check whether build commit is still current master HEAD before build
        if: needs.decide.outputs.should_publish == 'true'
        id: current_head_prebuild
        run: |
          set -euo pipefail
          CURRENT_MASTER_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          BUILD_SHA="${{ needs.decide.outputs.head_sha }}"
          if [ "$CURRENT_MASTER_SHA" = "$BUILD_SHA" ]; then
            STILL_CURRENT=true
          else
            STILL_CURRENT=false
          fi
          echo "still_current=${STILL_CURRENT}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        if: needs.decide.outputs.should_publish != 'true' || steps.current_head_prebuild.outputs.still_current == 'true'
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            XCODE_DIR="/Applications/Xcode.app/Contents/Developer"
          else
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | head -n 1 || true)"
            if [ -n "$XCODE_APP" ]; then
              XCODE_DIR="$XCODE_APP/Contents/Developer"
            else
              echo "No Xcode.app found under /Applications" >&2
              exit 1
            fi
          fi
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Install build deps
        if: needs.decide.outputs.should_publish != 'true' || steps.current_head_prebuild.outputs.still_current == 'true'
        run: |
          ZIG_REQUIRED="0.15.2"
          if command -v zig >/dev/null 2>&1 && zig version 2>/dev/null | grep -q "^${ZIG_REQUIRED}"; then
            echo "zig ${ZIG_REQUIRED} already installed"
          else
            echo "Installing zig ${ZIG_REQUIRED} from tarball"
            curl -fSL "https://ziglang.org/download/${ZIG_REQUIRED}/zig-aarch64-macos-${ZIG_REQUIRED}.tar.xz" -o /tmp/zig.tar.xz
            tar xf /tmp/zig.tar.xz -C /tmp
            sudo mkdir -p /usr/local/bin /usr/local/lib
            sudo cp -f /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/zig /usr/local/bin/zig
            sudo cp -rf /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/lib /usr/local/lib/zig
            export PATH="/usr/local/bin:$PATH"
            zig version
          fi
          npm install --global "create-dmg@${CREATE_DMG_VERSION}"

      - name: Download pre-built GhosttyKit.xcframework
        if: needs.decide.outputs.should_publish != 'true' || steps.current_head_prebuild.outputs.still_current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Swift packages
        if: needs.decide.outputs.should_publish != 'true' || steps.current_head_prebuild.outputs.still_current == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: termloop/.spm-cache
          key: spm-${{ hashFiles('termloop/GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: termloop/daemon/remote/go.mod

      - name: Derive Sparkle public key from private key
        if: needs.decide.outputs.should_publish != 'true' || steps.current_head_prebuild.outputs.still_current == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Missing SPARKLE_PRIVATE_KEY secret" >&2
            exit 1
          fi
          DERIVED_PUBLIC_KEY=$(swift scripts/derive_sparkle_public_key.swift "$SPARKLE_PRIVATE_KEY")
          echo "SPARKLE_PUBLIC_KEY=$DERIVED_PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Build universal nightly app (Release)
        if: needs.decide.outputs.should_publish != 'true' || steps.current_head_prebuild.outputs.still_current == 'true'
        run: |
          xcodebuild -scheme termloop -configuration Release -derivedDataPath build-universal \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            TERMLOOP_SKIP_ZIG_BUILD=1 \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon-Nightly \
            build

      - name: Verify nightly binary architectures
        if: needs.decide.outputs.should_publish != 'true' || steps.current_head_prebuild.outputs.still_current == 'true'
        run: |
          set -euo pipefail
          APP_BINARY="build-universal/Build/Products/Release/TermLoop.app/Contents/MacOS/TermLoop"
          CLI_BINARY="build-universal/Build/Products/Release/TermLoop.app/Contents/Resources/bin/termloop"
          HELPER_BINARY="build-universal/Build/Products/Release/TermLoop.app/Contents/Resources/bin/ghostty"
          APP_ARCHS="$(lipo -archs "$APP_BINARY")"
          CLI_ARCHS="$(lipo -archs "$CLI_BINARY")"
          HELPER_ARCHS="$(lipo -archs "$HELPER_BINARY")"
          [[ "$APP_ARCHS" == *arm64* && "$APP_ARCHS" == *x86_64* ]]
          [[ "$CLI_ARCHS" == *arm64* && "$CLI_ARCHS" == *x86_64* ]]
          [[ "$HELPER_ARCHS" == *arm64* && "$HELPER_ARCHS" == *x86_64* ]]

      - name: Check whether build commit is still current master HEAD after build
        if: needs.decide.outputs.should_publish == 'true' && steps.current_head_prebuild.outputs.still_current == 'true'
        id: current_head_postbuild
        run: |
          set -euo pipefail
          CURRENT_MASTER_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          BUILD_SHA="${{ needs.decide.outputs.head_sha }}"
          if [ "$CURRENT_MASTER_SHA" = "$BUILD_SHA" ]; then
            STILL_CURRENT=true
          else
            STILL_CURRENT=false
          fi
          echo "still_current=${STILL_CURRENT}" >> "$GITHUB_OUTPUT"

      - name: Inject nightly identities and metadata
        if: needs.decide.outputs.should_publish != 'true' || (steps.current_head_prebuild.outputs.still_current == 'true' && steps.current_head_postbuild.outputs.still_current == 'true')
        run: |
          set -euo pipefail
          SHORT_SHA="${{ needs.decide.outputs.short_sha }}"
          APP_DIR="build-universal/Build/Products/Release"
          BASE_MARKETING=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${APP_DIR}/TermLoop.app/Contents/Info.plist")
          NIGHTLY_DATE=$(date -u +%Y%m%d)
          if [ -n "${GITHUB_RUN_ID:-}" ]; then
            RUN_ATTEMPT="$(printf '%02d' "${GITHUB_RUN_ATTEMPT:-1}")"
            NIGHTLY_BUILD="${GITHUB_RUN_ID}${RUN_ATTEMPT}"
          else
            NIGHTLY_BUILD="${NIGHTLY_DATE}000000"
          fi
          NIGHTLY_MARKETING_VERSION="${BASE_MARKETING}-nightly.${NIGHTLY_BUILD}"
          echo "NIGHTLY_BUILD=${NIGHTLY_BUILD}" >> "$GITHUB_ENV"
          echo "NIGHTLY_MARKETING_VERSION=${NIGHTLY_MARKETING_VERSION}" >> "$GITHUB_ENV"
          echo "NIGHTLY_REMOTE_DAEMON_VERSION=${NIGHTLY_MARKETING_VERSION}" >> "$GITHUB_ENV"
          NIGHTLY_DMG_IMMUTABLE="termloop-nightly-macos-${NIGHTLY_BUILD}.dmg"
          echo "NIGHTLY_DMG_IMMUTABLE=${NIGHTLY_DMG_IMMUTABLE}" >> "$GITHUB_ENV"

          prepare_variant() {
            local app_dir="$1"
            local bundle_id="$2"
            local feed_url="$3"
            local app_plist="$app_dir/TermLoop.app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleName TermLoop NIGHTLY" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName TermLoop NIGHTLY" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${bundle_id}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$app_plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$app_plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string ${SPARKLE_PUBLIC_KEY}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Add :SUFeedURL string ${feed_url}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NIGHTLY_MARKETING_VERSION}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NIGHTLY_BUILD}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Delete :TERMLOOPCommit" "$app_plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :TERMLOOPCommit string ${SHORT_SHA}" "$app_plist"
            mv "$app_dir/TermLoop.app" "$app_dir/TermLoop NIGHTLY.app"
          }

          prepare_variant \
            "$APP_DIR" \
            "com.termloop.app.nightly" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/termloop-nightly-appcast.xml"

      - name: Build remote daemon nightly assets and inject manifest
        if: needs.decide.outputs.should_publish != 'true' || (steps.current_head_prebuild.outputs.still_current == 'true' && steps.current_head_postbuild.outputs.still_current == 'true')
        run: |
          set -euo pipefail
          ./scripts/build_remote_daemon_release_assets.sh \
            --version "$NIGHTLY_REMOTE_DAEMON_VERSION" \
            --release-tag "nightly" \
            --repo "${GITHUB_REPOSITORY}" \
            --output-dir "remote-daemon-assets" \
            --asset-suffix "$NIGHTLY_BUILD"
          MANIFEST_JSON="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1], encoding="utf-8")), separators=(",",":")))' "remote-daemon-assets/termloopd-remote-manifest-${NIGHTLY_BUILD}.json")"
          APP_PLIST="build-universal/Build/Products/Release/TermLoop NIGHTLY.app/Contents/Info.plist"
          plutil -remove TERMLOOPRemoteDaemonManifestJSON "$APP_PLIST" >/dev/null 2>&1 || true
          plutil -insert TERMLOOPRemoteDaemonManifestJSON -string "$MANIFEST_JSON" "$APP_PLIST"
          for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            cp "remote-daemon-assets/termloopd-remote-${platform}-${NIGHTLY_BUILD}" \
               "remote-daemon-assets/termloopd-remote-${platform}"
          done
          (
            cd remote-daemon-assets
            shasum -a 256 \
              termloopd-remote-darwin-arm64 \
              termloopd-remote-darwin-amd64 \
              termloopd-remote-linux-arm64 \
              termloopd-remote-linux-amd64 \
              > termloopd-remote-checksums.txt
          )
          cp "remote-daemon-assets/termloopd-remote-manifest-${NIGHTLY_BUILD}.json" \
             "remote-daemon-assets/termloopd-remote-manifest.json"

      - name: Import signing cert
        if: needs.decide.outputs.should_publish != 'true' || (steps.current_head_prebuild.outputs.still_current == 'true' && steps.current_head_postbuild.outputs.still_current == 'true')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "Missing signing certificate secrets" >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r keychain; do
            [ -n "$keychain" ] && ORIGINAL_KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"$//')
          ORIGINAL_DEFAULT_KEYCHAIN="$(security default-keychain -d user | sed 's/^[[:space:]]*"//; s/"$//')"
          {
            echo 'ORIGINAL_KEYCHAINS<<EOF'
            printf '%s\n' "${ORIGINAL_KEYCHAINS[@]}"
            echo EOF
            echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN"
          } >> "$GITHUB_ENV"
          security list-keychains -d user -s build.keychain "${ORIGINAL_KEYCHAINS[@]}"

      - name: Codesign apps
        if: needs.decide.outputs.should_publish != 'true' || (steps.current_head_prebuild.outputs.still_current == 'true' && steps.current_head_postbuild.outputs.still_current == 'true')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Missing APPLE_SIGNING_IDENTITY secret" >&2
            exit 1
          fi
          ENTITLEMENTS="termloop.entitlements"
          APP_PATH="build-universal/Build/Products/Release/TermLoop NIGHTLY.app"
          CLI_PATH="$APP_PATH/Contents/Resources/bin/termloop"
          HELPER_PATH="$APP_PATH/Contents/Resources/bin/ghostty"
          if [ -f "$CLI_PATH" ]; then
            /usr/bin/codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" --entitlements "$ENTITLEMENTS" "$CLI_PATH"
          fi
          if [ -f "$HELPER_PATH" ]; then
            /usr/bin/codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" --entitlements "$ENTITLEMENTS" "$HELPER_PATH"
          fi
          /usr/bin/codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" --entitlements "$ENTITLEMENTS" --deep "$APP_PATH"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize apps and dmgs
        if: needs.decide.outputs.should_publish != 'true' || (steps.current_head_prebuild.outputs.still_current == 'true' && steps.current_head_postbuild.outputs.still_current == 'true')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Missing notarization secrets" >&2
            exit 1
          fi
          APP_PATH="build-universal/Build/Products/Release/TermLoop NIGHTLY.app"
          ZIP_SUBMIT="termloop-nightly-notary.zip"
          DMG_RELEASE="termloop-nightly-macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_SUBMIT"
          APP_SUBMIT_JSON="$(xcrun notarytool submit "$ZIP_SUBMIT" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --output-format json)"
          APP_SUBMIT_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$APP_SUBMIT_JSON")"
          APP_STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$APP_SUBMIT_JSON")"
          if [ "$APP_STATUS" != "Accepted" ]; then
            xcrun notarytool log "$APP_SUBMIT_ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          rm -f "$ZIP_SUBMIT"
          TMP_DMG_DIR="$(mktemp -d)"
          create-dmg --identity="$APPLE_SIGNING_IDENTITY" "$APP_PATH" "$TMP_DMG_DIR"
          CREATED_DMG="$(find "$TMP_DMG_DIR" -maxdepth 1 -name '*.dmg' | head -n 1)"
          mv "$CREATED_DMG" "$DMG_RELEASE"
          rm -rf "$TMP_DMG_DIR"
          DMG_SUBMIT_JSON="$(xcrun notarytool submit "$DMG_RELEASE" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --output-format json)"
          DMG_SUBMIT_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$DMG_SUBMIT_JSON")"
          DMG_STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$DMG_SUBMIT_JSON")"
          if [ "$DMG_STATUS" != "Accepted" ]; then
            xcrun notarytool log "$DMG_SUBMIT_ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple "$DMG_RELEASE"
          xcrun stapler validate "$DMG_RELEASE"
          cp "$DMG_RELEASE" "$NIGHTLY_DMG_IMMUTABLE"

      - name: Upload dSYMs to Sentry
        if: needs.decide.outputs.should_publish != 'true' || (steps.current_head_prebuild.outputs.still_current == 'true' && steps.current_head_postbuild.outputs.still_current == 'true')
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: agentloop-22
          SENTRY_PROJECT: apple-macos
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            exit 0
          fi
          brew install getsentry/tools/sentry-cli || true
          sentry-cli debug-files upload --include-sources build-universal/Build/Products/Release/

      - name: Generate Sparkle appcasts (nightly)
        if: needs.decide.outputs.should_publish != 'true' || (steps.current_head_prebuild.outputs.still_current == 'true' && steps.current_head_postbuild.outputs.still_current == 'true')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Missing SPARKLE_PRIVATE_KEY secret" >&2
            exit 1
          fi
          ./scripts/sparkle_generate_appcast.sh "$NIGHTLY_DMG_IMMUTABLE" nightly termloop-nightly-appcast.xml
          cp termloop-nightly-appcast.xml termloop-nightly-appcast-universal.xml

      - name: Attest remote daemon nightly assets
        if: (needs.decide.outputs.should_publish != 'true' || (steps.current_head_prebuild.outputs.still_current == 'true' && steps.current_head_postbuild.outputs.still_current == 'true')) && github.event.repository.private == false
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            termloop/remote-daemon-assets/termloopd-remote-darwin-arm64-${{ env.NIGHTLY_BUILD }}
            termloop/remote-daemon-assets/termloopd-remote-darwin-amd64-${{ env.NIGHTLY_BUILD }}
            termloop/remote-daemon-assets/termloopd-remote-linux-arm64-${{ env.NIGHTLY_BUILD }}
            termloop/remote-daemon-assets/termloopd-remote-linux-amd64-${{ env.NIGHTLY_BUILD }}
            termloop/remote-daemon-assets/termloopd-remote-checksums-${{ env.NIGHTLY_BUILD }}.txt
            termloop/remote-daemon-assets/termloopd-remote-manifest-${{ env.NIGHTLY_BUILD }}.json

      - name: Upload branch nightly artifacts
        if: needs.decide.outputs.should_publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termloop-nightly-${{ needs.decide.outputs.short_sha }}
          path: |
            termloop/termloop-nightly-macos*.dmg
            termloop/termloop-nightly-appcast.xml
            termloop/termloop-nightly-appcast-universal.xml
            termloop/remote-daemon-assets/termloopd-remote-*
          if-no-files-found: error

      - name: Move nightly tag to built commit
        if: needs.decide.outputs.should_publish == 'true' && steps.current_head_prebuild.outputs.still_current == 'true' && steps.current_head_postbuild.outputs.still_current == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "${{ needs.decide.outputs.head_sha }}"
          git push origin refs/tags/nightly --force

      - name: Publish nightly release assets
        if: needs.decide.outputs.should_publish == 'true' && steps.current_head_prebuild.outputs.still_current == 'true' && steps.current_head_postbuild.outputs.still_current == 'true'
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          make_latest: false
          body: |
            Automated nightly build for `${{ needs.decide.outputs.short_sha }}`.
          files: |
            termloop/termloop-nightly-macos-${{ env.NIGHTLY_BUILD }}.dmg
            termloop/termloop-nightly-macos.dmg
            termloop/termloop-nightly-appcast.xml
            termloop/termloop-nightly-appcast-universal.xml
            termloop/remote-daemon-assets/termloopd-remote-*
          overwrite_files: true

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "${ORIGINAL_KEYCHAINS:-}" ]; then
            RESTORE_KEYCHAINS=()
            while IFS= read -r keychain; do
              [ -n "$keychain" ] && RESTORE_KEYCHAINS+=("$keychain")
            done <<< "$ORIGINAL_KEYCHAINS"
            if [ "${#RESTORE_KEYCHAINS[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${RESTORE_KEYCHAINS[@]}"
            fi
          fi
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ] && [ -e "$ORIGINAL_DEFAULT_KEYCHAIN" ]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" >/dev/null 2>&1 || true
          fi
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -f /tmp/cert.p12
