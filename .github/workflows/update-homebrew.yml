name: Update Homebrew Cask

on:
  # Run after the signed DMG release workflow completes so the asset exists
  # before calculating the cask SHA256.
  workflow_run:
    workflows: ["Release TermLoop app"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, with or without v prefix (for example, 1.0.11)"
        required: true

permissions:
  contents: read

jobs:
  update-cask:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Get version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.workflow_run.head_branch }}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not determine version" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Invalid version: ${VERSION}" >&2
              exit 1
            fi
            echo "Skipping Homebrew cask update for non-release ref: ${VERSION}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Updating Homebrew cask to version $VERSION"

      - name: Download DMG and get SHA256
        id: sha
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/feritzcan2/termloop/releases/download/v${VERSION}/termloop-macos.dmg"
          MAX_RETRIES=5
          for i in $(seq 1 "$MAX_RETRIES"); do
            HTTP_CODE=$(curl -sL -w '%{http_code}' "$URL" -o termloop-macos.dmg)
            FILE_SIZE=$(stat --printf="%s" termloop-macos.dmg 2>/dev/null || stat -f%z termloop-macos.dmg)
            if [ "$HTTP_CODE" = "200" ] && [ "$FILE_SIZE" -gt 1000000 ]; then
              echo "Download OK: HTTP $HTTP_CODE, size $FILE_SIZE bytes"
              break
            fi
            echo "Attempt $i/$MAX_RETRIES: HTTP $HTTP_CODE, size ${FILE_SIZE:-0} bytes"
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "Failed to download DMG after $MAX_RETRIES attempts" >&2
              exit 1
            fi
            sleep 30
          done
          SHA256=$(shasum -a 256 termloop-macos.dmg | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "DMG SHA256: $SHA256"

      - name: Checkout Homebrew tap
        if: steps.version.outputs.skip != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: feritzcan2/homebrew-termloop
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-termloop

      - name: Update cask formula
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail
          cat > homebrew-termloop/Casks/termloop.rb << CASKEOF
          cask "termloop" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/feritzcan2/termloop/releases/download/v#{version}/termloop-macos.dmg",
                verified: "github.com/feritzcan2/termloop/"
            name "TermLoop"
            desc "Native macOS terminal for AI coding agents"
            homepage "https://termloop.ai"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: ">= :sonoma"

            app "TermLoop.app"
            binary "#{appdir}/TermLoop.app/Contents/Resources/bin/termloop"

            zap trash: [
              "~/Library/Application Support/TermLoop",
              "~/Library/Caches/TermLoop",
              "~/Library/Preferences/com.termloop.app.plist",
            ]
          end
          CASKEOF
          sed -i 's/^          //' homebrew-termloop/Casks/termloop.rb

      - name: Verify cask SHA matches DMG
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          CASK_SHA=$(grep 'sha256' homebrew-termloop/Casks/termloop.rb | sed 's/.*"\(.*\)".*/\1/')
          ACTUAL_SHA=$(shasum -a 256 termloop-macos.dmg | cut -d' ' -f1)
          if [ "$CASK_SHA" != "$ACTUAL_SHA" ]; then
            echo "SHA mismatch! Cask: $CASK_SHA, Actual: $ACTUAL_SHA" >&2
            exit 1
          fi
          echo "SHA verification passed: $CASK_SHA"

      - name: Commit and push
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd homebrew-termloop
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/termloop.rb
          if git diff --staged --quiet; then
            echo "No changes - cask already up to date"
          else
            git commit -m "Update termloop to ${VERSION}"
            git push
          fi
