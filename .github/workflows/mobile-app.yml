name: TermLoop mobile app

on:
  pull_request:
    paths:
      - "terminal-app/**"
      - ".github/workflows/mobile-app.yml"
  push:
    branches:
      - master
    paths:
      - "terminal-app/**"
      - ".github/workflows/mobile-app.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - development-simulator
          - preview
          - staging
          - production
      platform:
        description: EAS platform
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
          - all
      auto_submit:
        description: Submit store builds after build
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-app-${{ github.event_name }}-${{ github.ref_name }}-${{ inputs.profile || 'check' }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      terminal_app: ${{ steps.changed.outputs.terminal_app }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Detect terminal-app changes
        id: changed
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
          else
            git fetch --no-tags --depth=1 origin "$before" || true
            changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
          fi

          if printf '%s\n' "$changed_files" | grep -q '^terminal-app/'; then
            echo "terminal_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "terminal_app=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal-app
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terminal-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  eas-build:
    if: github.event_name == 'workflow_dispatch'
    needs: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terminal-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is required for EAS builds." >&2
            exit 1
          fi

      - name: Run EAS build
        run: |
          extra_args=""
          if [ "${{ inputs.auto_submit }}" = "true" ]; then
            extra_args="--auto-submit"
          fi
          npx eas-cli build \
            --non-interactive \
            --profile "${{ inputs.profile }}" \
            --platform "${{ inputs.platform }}" \
            $extra_args

  testflight-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.terminal_app == 'true'
    needs:
      - changes
      - typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terminal-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is required for automatic TestFlight releases." >&2
            exit 1
          fi

      - name: Build staging iOS app
        id: eas_build
        run: |
          set -euo pipefail
          BUILD_JSON="$RUNNER_TEMP/termloop-mobile-eas-build.json"

          npx eas-cli build \
            --profile staging \
            --platform ios \
            --wait \
            --json \
            > "$BUILD_JSON"

          BUILD_ID="$(node - "$BUILD_JSON" <<'NODE'
          const fs = require("fs");
          const path = process.argv[2];
          const parsed = JSON.parse(fs.readFileSync(path, "utf8"));
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          if (!build || typeof build.id !== "string" || build.id.length === 0) {
            console.error("Could not find EAS build id in JSON output");
            process.exit(1);
          }
          console.log(build.id);
          NODE
          )"

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Built EAS iOS staging build: $BUILD_ID"

      - name: Submit staging build to TestFlight
        run: |
          set -euo pipefail
          BUILD_ID="${{ steps.eas_build.outputs.build_id }}"
          if [ -z "$BUILD_ID" ]; then
            echo "Missing EAS build id." >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Submitting EAS build $BUILD_ID to TestFlight (attempt $attempt/3)"
            if npx eas-cli submit \
              --platform ios \
              --profile staging \
              --id "$BUILD_ID" \
              --wait \
              --non-interactive; then
              echo "Submitted EAS build $BUILD_ID to TestFlight"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep_seconds=$((attempt * 120))
              echo "Submit failed; retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            fi
          done

          echo "Failed to submit EAS build $BUILD_ID after 3 attempts." >&2
          exit 1
