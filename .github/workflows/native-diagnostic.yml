name: native-diagnostic

run-name: Native diagnostic (${{ github.sha }})

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Run Windows native verification
        required: true
        type: boolean
        default: true
      ubuntu:
        description: Run Ubuntu/Linux native verification
        required: true
        type: boolean
        default: false
      macos:
        description: Run macOS native verification
        required: true
        type: boolean
        default: false
      scope:
        description: Run tests only or the complete native gate
        required: true
        type: choice
        options:
          - tests
          - full
        default: tests

concurrency:
  group: >-
    termloop-native-diagnostic-${{ github.ref }}-${{ inputs.windows }}-${{ inputs.ubuntu }}-${{ inputs.macos }}-${{ inputs.scope }}
  cancel-in-progress: true

jobs:
  windows:
    if: inputs.windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: ./.github/actions/native-verify
        with:
          artifact-prefix: diagnostic-
          run-full-gate: ${{ inputs.scope == 'full' && 'true' || 'false' }}
          cache-pnpm: "false"
          upload-evidence: ${{ inputs.scope == 'full' && 'true' || 'false' }}

  ubuntu:
    if: inputs.ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: ./.github/actions/native-verify
        with:
          artifact-prefix: diagnostic-
          run-full-gate: ${{ inputs.scope == 'full' && 'true' || 'false' }}
          cache-pnpm: "false"
          upload-evidence: ${{ inputs.scope == 'full' && 'true' || 'false' }}
          upload-unsigned: ${{ inputs.scope == 'full' && 'true' || 'false' }}

  macos:
    if: inputs.macos
    runs-on: macos-15
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Prepare macOS diagnostic keychain
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY; do
            test -n "${!name:-}" || { echo "Missing required macOS diagnostic secret: $name" >&2; exit 1; }
          done
          keychain_path="$RUNNER_TEMP/termloop-diagnostic-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/termloop-diagnostic-signing.p12"
          original_default_path="$RUNNER_TEMP/termloop-diagnostic-default-keychain.txt"
          original_keychains_path="$RUNNER_TEMP/termloop-diagnostic-keychains.txt"
          keychain_password="$(uuidgen)"
          security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
          security default-keychain -d user |
            sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$original_default_path"
          security list-keychains -d user |
            sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$original_keychains_path"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          original_keychains=()
          while IFS= read -r existing_keychain; do
            test -n "$existing_keychain" && original_keychains+=("$existing_keychain")
          done < "$original_keychains_path"
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"
          security default-keychain -d user -s "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -k "$keychain_path" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" |
            grep -Fq -- "$MACOS_SIGNING_IDENTITY"
          echo "TERMLOOP_DEV_CODE_SIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-verify
        with:
          artifact-prefix: diagnostic-
          run-full-gate: ${{ inputs.scope == 'full' && 'true' || 'false' }}
          cache-pnpm: "false"
          upload-evidence: ${{ inputs.scope == 'full' && 'true' || 'false' }}
      - name: Restore macOS keychains
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/termloop-diagnostic-signing.keychain-db"
          original_default_path="$RUNNER_TEMP/termloop-diagnostic-default-keychain.txt"
          original_keychains_path="$RUNNER_TEMP/termloop-diagnostic-keychains.txt"
          if [ -s "$original_default_path" ]; then
            security default-keychain -d user -s "$(sed -n '1p' "$original_default_path")" >/dev/null 2>&1 || true
          fi
          if [ -s "$original_keychains_path" ]; then
            original_keychains=()
            while IFS= read -r existing_keychain; do
              test -n "$existing_keychain" && original_keychains+=("$existing_keychain")
            done < "$original_keychains_path"
            security list-keychains -d user -s "${original_keychains[@]}" >/dev/null 2>&1 || true
          fi
          security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/termloop-diagnostic-signing.p12" "$original_default_path" "$original_keychains_path"
