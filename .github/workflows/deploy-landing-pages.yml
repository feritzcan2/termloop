name: Deploy landing to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: termloop-next-landing-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production landing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN" >&2
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID" >&2
            exit 1
          }
          test -f landing/index.html

      - name: Select main as the Pages production branch
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;

          (async () => {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/termloop`,
              {
                method: "PATCH",
                headers: {
                  Authorization: `Bearer ${apiToken}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ production_branch: "main" }),
              },
            );
            const payload = await response.json();
            if (!response.ok || !payload.success || payload.result?.production_branch !== "main") {
              throw new Error(`Cloudflare rejected the production branch update (${response.status})`);
            }
            console.log("Cloudflare Pages production branch is main.");
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          wranglerVersion: "4.125.0"
          command: >-
            pages deploy landing
            --project-name=termloop
            --branch=main
